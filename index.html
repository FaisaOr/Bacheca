<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signage Faisa-Cisal Sardegna</title>
<style>
  :root{
    --mare:#0B2E48; --fondo:#071E31; --sabbia:#F1E7D3; --turchese:#4CC3B8; --nebbia:#9FB6C6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{
    position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
    background:linear-gradient(160deg,var(--mare) 0%,var(--fondo) 100%);
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--sabbia);overflow:hidden;
  }
  .slide{position:absolute;inset:0;padding:120px 140px 150px;display:grid;grid-template-columns:1fr 640px;column-gap:100px;align-items:center;opacity:0;transition:opacity .9s ease}
  .slide.on{opacity:1}
  .testo h1{font-size:92px;line-height:1.08;font-weight:700;letter-spacing:-1px;max-width:900px}
  .testo p{margin-top:44px;font-size:42px;line-height:1.35;color:var(--nebbia);max-width:880px}
  .cifra{border-left:6px solid var(--turchese);padding-left:56px}
  .cifra .n{font-size:260px;line-height:.95;font-weight:800;color:var(--turchese);letter-spacing:-6px}
  .cifra .u{margin-top:18px;font-size:44px;line-height:1.25;color:var(--sabbia)}
  footer{position:absolute;left:140px;right:140px;bottom:56px;display:flex;justify-content:space-between;align-items:baseline;font-size:28px;color:var(--nebbia)}
  footer b{color:var(--sabbia);font-weight:600}
  #barra{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--turchese)}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <footer><span id="fonte"></span><b>FAISA CISAL Sardegna</b></footer>
  <div id="barra"></div>
</div>

<script>
// Modifica qui i contenuti. durata = secondi di permanenza della slide.
const DURATA = 12;
const SLIDES = [
  { titolo:"Tre centrali a idrogeno verde per i treni ARST",
    testo:"Realizzate a Macomer, Mandas e Alghero con fondi PNRR, nei tempi previsti.",
    n:"76", u:"milioni di euro investiti", fonte:"Fonte: ANSA, 5 novembre 2026" },
  { titolo:"Il primo treno a idrogeno a scartamento ridotto",
    testo:"Presentato il 19 giugno 2026 da Stadler e ARST. Il primo convoglio è ora in test in Svizzera.",
    n:"1°", u:"al mondo su linee a scartamento ridotto", fonte:"Fonte: Railvolution; ANSA, 5 novembre 2026" },
  { titolo:"Ciclovia della Sardegna: completato il secondo lotto",
    testo:"Tratta Barumini–Terralba–Oristano–Bosa, finanziata con fondi PNRR.",
    n:"120", u:"chilometri di nuova ciclovia", fonte:"Fonte: ANSA, 5 novembre 2026" },
  { titolo:"Più capitale per ARST dalla Regione",
    testo:"Parte della variazione di bilancio regionale da oltre 120 milioni per trasporti e imprese.",
    n:"35", u:"milioni di euro per il capitale sociale ARST", fonte:"Fonte: L’Unione Sarda, novembre 2026" },
  { titolo:"Sassari: da ottobre è tornato Sirio",
    testo:"Servizio ARST nella tratta Emiciclo Garibaldi–Santa Maria di Pisa.",
    n:"5 ott", u:"ripresa del servizio MetroSassari", fonte:"Fonte: L’Unione Sarda, ottobre 2026" },
  { titolo:"Alghero: servizio urbano potenziato",
    testo:"Dal 22 giugno biglietto a bordo per l’aeroporto e nuovo centro informazioni ARST in via Catalogna.",
    n:"+34", u:"corse aggiuntive", fonte:"Fonte: L’Unione Sarda, giugno 2026" }
];

const stage = document.getElementById('stage');
const cont = document.getElementById('slides');
const fonte = document.getElementById('fonte');
const barra = document.getElementById('barra');

function scala(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = 'scale('+s+')';
  stage.style.left = (innerWidth-1920*s)/2+'px';
  stage.style.top = (innerHeight-1080*s)/2+'px';
}
addEventListener('resize', scala); scala();

SLIDES.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide';
  el.innerHTML = '<div class="testo"><h1></h1><p></p></div><div class="cifra"><div class="n"></div><div class="u"></div></div>';
  el.querySelector('h1').textContent = s.titolo;
  el.querySelector('p').textContent = s.testo;
  el.querySelector('.n').textContent = s.n;
  el.querySelector('.u').textContent = s.u;
  cont.appendChild(el);
});

const els = cont.querySelectorAll('.slide');
let i = -1, timer;
function mostra(k){
  i = (k+els.length)%els.length;
  els.forEach((e,j)=>e.classList.toggle('on', j===i));
  fonte.textContent = SLIDES[i].fonte;
  barra.style.transition='none'; barra.style.width='0';
  void barra.offsetWidth;
  barra.style.transition='width '+DURATA+'s linear'; barra.style.width='100%';
  clearTimeout(timer);
  timer = setTimeout(()=>mostra(i+1), DURATA*1000);
}
// Frecce sinistra/destra per provare le slide
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') mostra(i+1);
  if(e.key==='ArrowLeft') mostra(i-1);
});
mostra(0);
</script>
</body>
</html>
